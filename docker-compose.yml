services:
  api:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Mount local lakehouse + trained artifacts without rebuilding the image
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
